# Product API access declaration. Declare Cribl product API paths your app needs to access.
# At install time, admins see exactly which platform resources the app will use.
#
# READ THIS AS A GRANT, NOT AS DOCUMENTATION. AGENTS.md is explicit that when an
# admin shares this app with a user, every path declared here is granted to that
# user for the duration of a request made through the app. So this file decides
# two different things: what an admin is told the app will touch, and whether a
# non-admin's click works at all. A missing entry is a 403 the app reports as a
# failed step; an entry the app never uses is asking an admin to trust it with
# more than it needs. Both are defects, and src/cribl/policyCoverage.test.ts
# fails on either — it reads the source of every module that can reach the Cribl
# API, works out the path each call actually builds, and compares that list with
# this one in both directions. The reasons below are not decoration either:
# src/cribl/paths.ts carries the same sentence per call, and that is what the
# test checks the code against.
#
# Two conventions worth knowing before editing:
#
#   NO WILDCARDS. AGENTS.md never says whether `*` matches one path segment or
#   many, and this workspace cannot answer it (every caller here is an admin, and
#   an admin never exercises the matcher). Rather than guess, every object below
#   names each segment it needs, so the file means the same thing under either
#   reading. `:name` is a single variable segment and is what AGENTS.md offers as
#   the equivalent of `*` for a child path.
#
#   LITERALS WHERE THE APP ONLY EVER CALLS ONE VALUE. Search runs only in
#   `default_search`, and Guided Setup only ever touches the three objects it
#   created — so this file says `/m/:gid/system/inputs/in_gigamon_syslog` rather
#   than `/m/:gid/system/inputs/*`. The grant an admin approves is then "may
#   delete the input this app made", not "may delete any input".
#
# THE DASHBOARDS READ; THE APP WRITES IN SIX PLACES, AND FIVE OF THEM ARE IN
# HERE. The panels run Cribl Search jobs against the Cribl Lake dataset
# `gigamon_ami` and read the results — that is most of the objects below. The
# rest are the writes CLAUDE.md lists under "App-specific conventions":
#
#   1. Guided Setup provisioning — the syslog source, pipeline, route, Lake
#      dataset, a Git commit on the Leader and a deploy that restarts that
#      group's Worker Processes. Behind a confirmation in
#      components/ProvisionPanel.tsx that names each object.
#   2. The scheduled saved searches (acceleration) — created,
#      corrected, paused, resumed and deleted. Behind confirmations in
#      components/AccelPanel.tsx that name the ids and state the recurring cost.
#   3. The Lake landing panel (Phase 3), a second panel on the Guided Setup page —
#      PATCH on the live `gigamon_ami` Lake dataset (retention, description),
#      PATCH on the live `gigamon_lake` destination, and the Git commit and
#      deploy that make the second one real. Behind confirmations in
#      components/LakeLandingPanel.tsx. It is the most write-heavy surface in the
#      app and it holds the only IRREVERSIBLE write anywhere in it: a retention
#      decrease deletes data and there is no commit to revert, which is why that
#      one dialog is harder than the others.
#   4. `POST …/ai/settings/dataset-intelligence/gigamon_ami` — a plain Generate
#      button in components/DatasetIntelPrompt.tsx.
#   5. `POST …/jobs/:jobId/cancel` — this session's own abandoned job, no dialog
#      (seconds old, the user's own, not configuration); and from the watchdog a
#      long-running job the signed-in user owns, behind a confirmation in
#      components/JobWatchdog.tsx naming the job id and its age.
#
# The sixth write is the app-scoped KV store, which is deliberately NOT declared
# here — see the note at the foot of this file.
#
# Three of the five are writes to Cribl CONFIGURATION: the Guided Setup stack,
# the scheduled searches, and the Lake landing panel's two objects. Nothing in
# this file is reached from load, from render or from a timer — including the
# landing panel's measurement queries, which are buttons.
#
# Corrected in Phase 3 (branch `feat/phase-3-storage-surface`, 2026-09-17). This
# paragraph used to say FIVE places and FOUR of them here, and listed nothing
# under Cribl Lake but the dataset's creation.
#
# WHAT APPROVING THE WRITE ACTIONS ACTUALLY GRANTS — decision I-D4, accepted
# deliberately, and the paragraph to read before approving the install.
# A declared action is granted to EVERY user an admin shares this app with, for
# the duration of a request made through the app, INCLUDING a user whose own role
# would refuse it. The app cannot narrow that per user and does not pretend to:
# `window.getCriblUser()` carries no roles, and src/cribl/authz.ts explains why it
# does not gate on `/authorize/policy` either. So sharing this app means, in
# plain words:
#
#   * any Member who can open it can press Apply in the Acceleration panel and
#     create scheduled saved searches that RUN ON A CRON AND SPEND CREDITS until
#     somebody stops them — and uninstalling the app does not stop them (I-D28);
#   * any Member who can open it can reach Guided Setup's Remove and delete the
#     syslog source, the pipeline and this app's route in the worker group they
#     pick — the teardown, not the customer's own objects, but a teardown all the
#     same;
#   * any Member who can open it can SHORTEN RETENTION on the `gigamon_ami` Lake
#     dataset, which deletes everything older than the new window immediately and
#     for everyone, with no commit to revert and no snapshot to restore. That is
#     the one action this app can take that destroys customer data, and it is the
#     one to weigh hardest before sharing the app widely (Phase 3, I-D4).
#
# All three are behind confirmations that name what they will change, and all
# three are reported afterwards. None is undone by the platform. An install that
# does not want a Member holding those grants shares the app with fewer people;
# there is no narrower grant this file can express.
#
# Corrected in Phase 2 (branch `feat/phase-2-savings-schedules`, 2026-09-17).
# This header used to say: "The dashboards are read-only: they run Cribl Search
# jobs against the Cribl Lake dataset `gigamon_ami` and read the results. Guided
# Setup is the one place the app writes, and every call it makes is behind a
# confirmation in tabs/GuidedSetup.tsx that names the objects it will change."
# All three of those claims had already stopped being true: slice 1.4 declared
# the job cancel in the same commit as that sentence, slice 1.7 moved the
# provisioning confirmation into components/ProvisionPanel.tsx, and Phase 2 added
# the saved-search writes above.
policies:
  # --- Cribl Search: every dashboard panel ------------------------------------
  # Search always runs in the dedicated search group (AGENTS.md, "Config Group
  # Context"), so these are literal `default_search` paths. The app is granted
  # nothing in any other group by them.

  # POST runs a panel's KQL query — every figure in the app starts here.
  #
  # GET lists the jobs currently running, for the long-running-search watch in
  # src/cribl/jobWatchdog.ts. Slice 1.4 removed this action because nothing
  # called it; this is the commit that first calls it. It is a config-plane read
  # over job metadata — no search is submitted, nothing is billed, and no job is
  # added to the workspace's 1,000-job search history, which is what ruled out
  # the `dataset="$vt_jobs"` polling search the plan originally specified.
  #
  # It does mean this app can read the id, owner, status and QUERY TEXT of other
  # people's searches wherever the caller's own role already allows that — which
  # is the point (on the workspace where this was measured, every hung job
  # belonged to a colleague) and is worth an admin knowing before they approve
  # it. It is a READ of those, and nothing more: the app offers Cancel only on
  # searches the signed-in user started. The app lists only jobs whose resolved
  # datasets include gigamon_ami, and only those that have been running for
  # twice the longest time it ever permits one of its own queries.
  - object: '/m/default_search/search/jobs'
    actions: ['GET', 'POST']
  # Read a failed job's errors, to tell a query stopped by its running-time cap
  # (which the panel says plainly) from one that failed for another reason.
  - object: '/m/default_search/search/jobs/:jobId'
    actions: ['GET']
  # Poll a submitted job until it completes. Without this every panel in the app
  # hangs at "loading" forever — which is what a non-admin used to see.
  - object: '/m/default_search/search/jobs/:jobId/status'
    actions: ['GET']
  # Read the rows a completed job produced: the data behind every chart and table.
  - object: '/m/default_search/search/jobs/:jobId/results'
    actions: ['GET']
  # Per-field fill, cardinality and top values, for the Field Explorer tab.
  - object: '/m/default_search/search/jobs/:jobId/field-summaries'
    actions: ['GET']
  # A completed job's billable CPU-seconds, for the header's auto-refresh cost
  # label. Declared like any other read because a denial here is invisible: the
  # app would show a cost figure that is wrong rather than an error.
  - object: '/m/default_search/search/jobs/:jobId/metrics'
    actions: ['GET']
  # Stop a job this session started when the search is abandoned (range change,
  # tab switch, unmount) or outlives its client timeout, so it stops billing
  # instead of running to its cap. No dialog: it is the user's own job, seconds
  # old, and not configuration.
  #
  # The same grant also lets the long-running-search watch cancel a job this
  # session did not start — but still ONE OF THE USER'S OWN, left running in
  # Cribl Search or escaped from this app's own running-time cap. The watch
  # lists every long-running search the account can see and offers Cancel only
  # where the signed-in user owns the job: this app does not stop work it did
  # not start, and nothing granted here lets it. That cancel is confirmed
  # because of the job's AGE rather than its owner — a deliberate click, a
  # dialog naming the job id and how long it has been running, and the outcome
  # reported afterwards. Never from a render or a timer.
  - object: '/m/default_search/search/jobs/:jobId/cancel'
    actions: ['POST']

  # --- The scheduled saved searches (acceleration) -----------------------------
  # src/cribl/accel/provision.ts, reached only from the Acceleration panel's
  # confirmed Apply / Pause / Resume / Remove controls. The app writes a fixed
  # set of objects here, every one of them an id defined in
  # src/cribl/accel/manifest.ts — that list is the authority, and this comment
  # deliberately does not restate the count. It said "exactly two" and named
  # them, which was true of Phase 2 and silently stopped being true twice: the
  # set went two → six → nine while this text still told an admin they were
  # approving two crons. Wrong in the direction that understates the spend, in
  # the one paragraph that asks to be read hardest.
  #
  # Each entry runs on a cron so a panel can read the stored result instead of
  # scanning live. Two of them replace a query measured as expensive (the 30-day
  # Lake total, 9,297.7 billable CPU-s a run, becomes about 0.2). The rest are
  # hourly snapshots that also buy something no live query sells at any price —
  # a day of past states a viewer can move between — and those cost their ~40
  # CPU-s an hour whether or not anybody opens the tab. `why` on each manifest
  # entry states which of the two it is.
  #
  # READ THIS ONE HARDEST, because it is the only grant in the file that lets
  # the app start something that keeps costing money after the click.
  #
  # Declaring POST, PATCH and DELETE here grants them to EVERY user this app is
  # shared with, for the duration of a request made through the app. So a Member
  # who cannot otherwise create a scheduled search can create one through this
  # app's Apply button, and a scheduled search spends credits on a cron until
  # somebody stops it. That was accepted deliberately (decision I-D4): an
  # acceleration feature only an admin can switch on is one most installs never
  # switch on, in an app whose purpose is lowering the bill.
  #
  # What narrows it is the app rather than the grant, and it is worth knowing
  # exactly how far that goes:
  #   * it POSTs only manifest ids, on the crons and windows in the manifest;
  #   * every write is behind a confirmation naming the searches;
  #   * it DELETEs only an id matching `gno_` that is in the manifest AND
  #     carries this app's own `GNO …` stamp in its description — a saved search
  #     with the same name that this app did not create is reported and left;
  #   * nothing here runs on load, on render or on a timer.
  #
  # DELETE is not optional. Removing the app does not remove these searches —
  # the platform gives an app no uninstall hook (I-D28) — so the Remove button
  # is the only way a customer stops the spend, and this is the grant it needs.
  #
  # GET on the collection lists the whole workspace's saved searches, not just
  # ours: their names, queries and schedules, wherever the caller's own role
  # already allows that. The app shows none of them. It picks out its own
  # manifest ids, notices a `gno_` search an older release left behind, and counts the
  # rest only as "there may be more than one page". GET on the child path reads
  # one object whole, and is part of every write rather than a separate
  # convenience: a PATCH deletes every field it omits (measured, A-SP23), so the
  # only safe way to change one setting is to read the whole object and send it
  # all back.
  - object: '/m/default_search/search/saved'
    actions: ['GET', 'POST']
  - object: '/m/default_search/search/saved/:id'
    actions: ['GET', 'PATCH', 'DELETE']

  # --- Cribl Search AI: dataset intelligence ----------------------------------
  # Whether the tenant has AI features switched on at all, so the app offers them
  # only where they exist.
  - object: '/ai/settings/features'
    actions: ['GET']
  # Read the generated schema summary for the gigamon_ami dataset (GET), and
  # generate it once from a button the user presses (POST). Without it the
  # Copilot agent rediscovers the ~319-field schema on every AI investigation.
  - object: '/ai/settings/dataset-intelligence/:dataset'
    actions: ['GET', 'POST']

  # --- Guided Setup: the Gigamon AMI syslog onboarding stack ------------------
  # cribl/provision.ts, reached only from the Guided Setup tab's confirmed
  # Deploy / Remove buttons. Everything it creates is additive and scoped to the
  # five objects named in that confirmation. It never edits the demo DataGen
  # source or any other shared resource, and the route is prepended above the
  # catch-all with a filter scoped to this app's own source.

  # The Stream worker group the stack is applied to. /products/stream/... is the
  # current path family and /master/groups the deprecated one; both are declared
  # because provision.ts falls back to the old path on a 404, which is how an
  # older Leader answers the new one.

  # List the worker groups Guided Setup offers in its picker.
  - object: '/master/groups'
    actions: ['GET']
  # Read which commit a group's Workers are running, so a commit an earlier run
  # left undeployed can be found and finished rather than stranded forever.
  - object: '/products/stream/groups/:gid'
    actions: ['GET']
  - object: '/master/groups/:gid'
    actions: ['GET']
  # Push the committed config to the group's running Workers. This is the step
  # that makes a deploy real, and it RESTARTS THAT GROUP'S WORKER PROCESSES — a
  # source configured to block on backpressure can lose seconds of data across
  # the restart. Two confirmed surfaces reach it: Guided Setup's Deploy and
  # Remove, and (Phase 3) the Lake landing panel's destination edit, which is
  # useless uncommitted and undeployed and so carries all three in one dialog.
  # The deprecated path is tried only on a 404 — a 403 cannot be granted by a
  # second path, and a 5xx deploy may already have started server-side.
  - object: '/products/stream/groups/:gid/deploy'
    actions: ['PATCH']
  - object: '/master/groups/:gid/deploy'
    actions: ['PATCH']

  # The Cribl Lake dataset the dashboards read. GET to see whether it exists,
  # POST to create it when it does not. `default` is the lake itself, not a
  # placeholder — the app never addresses another one.
  #
  # No DELETE, on purpose. The dataset holds the customer's ingested flow
  # records, so a DELETE grant would let this app destroy that data; the teardown
  # leaves it, and removing it is a Cribl Lake operation the customer performs
  # deliberately. src/cribl/paths.ts carries that decision as a named exception,
  # so the paired-teardown check passes it rather than missing it.
  - object: '/products/lake/lakes/default/datasets'
    actions: ['GET', 'POST']

  # --- The Lake landing panel (Phase 3) ---------------------------------------
  # src/cribl/lake.ts reads; src/cribl/lakeLanding.ts writes, and only from a
  # confirmation in the landing panel that names the object and shows what
  # changes. Nothing in this block creates anything: every call reads, or edits
  # an object the customer already owns.

  # This tenant's Cribl Lake limits — chiefly how many partition fields a dataset
  # may carry — so a setting is checked against the tenant instead of against a
  # number this app remembered. A 404 is how an on-prem Leader says Cribl Lake is
  # Cloud-only; the panel reports that rather than an error.
  - object: '/products/lake/lakes/default/config'
    actions: ['GET']

  # The gigamon_ami dataset itself. GET reads retention, partitions, format,
  # description, search configuration and the stored size with the day it was
  # computed — which is also the only record of what a value was before, because
  # LAKE DATASETS ARE UNDER NO VERSION CONTROL.
  #
  # PATCH IS THE SHARPEST GRANT IN THIS FILE — READ IT BEFORE APPROVING. It
  # changes retention or the description. A retention DECREASE deletes everything
  # in the dataset older than the new window, immediately, for everyone who reads
  # it, and there is no commit to revert and no snapshot to restore. Retention
  # counts from the date data was uploaded, not from the event timestamp. The
  # confirmation for a decrease is deliberately harder than the others: it states
  # why it cannot be undone, names the current size and the day that size was
  # measured, and requires the dataset id to be typed.
  #
  # Like every action here it is granted to EVERY user this app is shared with,
  # for the duration of a request made through the app (I-D4) — including a user
  # whose own role would refuse it. An install that does not want a Member able
  # to shorten retention on this dataset shares the app with fewer people.
  #
  # No DELETE, for the reason the collection entry above gives.
  - object: '/products/lake/lakes/default/datasets/gigamon_ami'
    actions: ['GET', 'PATCH']

  # How Cribl Search sees the same dataset: which reader version it uses, and
  # what storage format it believes the objects are in. Read separately from the
  # Lake-side object rather than derived from it, because whether the two agree
  # is precisely what has not been verified — so the panel shows both and lets a
  # person see a disagreement.
  #
  # NO PATCH, DELIBERATELY. A reader toggle has two candidate request shapes and
  # nobody has sent either; spike P-S5 decides which endpoint changes it.
  # Declaring the write before the spike says it is needed would ask an admin to
  # approve a grant the app cannot use.
  - object: '/m/default_search/search/datasets/gigamon_ami'
    actions: ['GET']

  # Whether this workspace has Cribl Search local engines. A 404 means local
  # search is not enabled, which is the ordinary state of most tenants and is
  # shown as a value, not as a fault. BOTH paths are read every time, including
  # on that 404: the engines list does not 404 in the zero-engine state, it
  # answers 200 with an empty list, so it is the only response that separates
  # "local search is on and nothing is sized for it" from "local search is not on
  # this tenant". An engine serves the local_search ingest datasets; it does not
  # accelerate a Cribl Lake dataset, which is what the panel row now says.
  - object: '/m/default_search/search/local_search'
    actions: ['GET']
  - object: '/m/default_search/search/local_search/engines'
    actions: ['GET']

  # The worker groups from the current path family, for the commit each group is
  # running. A rollback needs a target, and "redeploy the previous version" is
  # not a plan until that version has a name. Guided Setup's picker still reads
  # the deprecated /master/groups below; this is what starts retiring it.
  - object: '/products/stream/groups'
    actions: ['GET']

  # The four group-scoped config objects, under the /m/:gid prefix every
  # non-/system/ endpoint takes. The group is the one the user picks, so :gid has
  # to stay a placeholder — which means these writes are granted in EVERY worker
  # group on the Leader, not only the one the picker selects. The app cannot
  # narrow that; the README says so plainly under "What installing this app
  # grants".

  # The Syslog source Gigamon AMX exports arrive on (TCP/UDP 5514). POST creates
  # it; GET answers "does it exist yet" and drives the status pill; PATCH
  # re-applies the spec to one that is already there — that is the grant slice
  # 1.3 shipped without, where deploying a fresh stack worked and every re-apply
  # afterwards 403ed; DELETE is the teardown, and only ever of this source.
  #
  # Since Phase 3 the PATCH is sent only when the live source does not already
  # say what the spec says. It used to go out on every re-apply regardless, which
  # dirtied the group's Git status and carried the run on into a commit and a
  # deploy for a change that was not one.
  #
  # GET on the COLLECTION is the landing panel's, not provisioning's: it lists
  # the group's sources so the app can work out what actually writes through the
  # gigamon_lake destination. The routing table is not the whole answer — on the
  # workspace this was measured against, a source reaches Cribl Lake through a
  # QuickConnect binding on the source itself and appears in no route at all — so
  # a destination confirmation built on routes alone would under-report the feeds
  # it affects. It reads every source in the group, including ones this app did
  # not create; it shows only those wired to this destination.
  - object: '/m/:gid/system/inputs'
    actions: ['GET', 'POST']
  - object: '/m/:gid/system/inputs/in_gigamon_syslog'
    actions: ['GET', 'PATCH', 'DELETE']

  # The Cribl Lake destination. POST creates it only on a tenant that does not
  # already have one. No DELETE — see LEFT_BEHIND in src/cribl/paths.ts for the
  # decision and what an uninstall leaves behind.
  #
  # PATCH ARRIVED IN PHASE 3 AND IS A REAL WIDENING — the header of this file
  # used to say "the app never rewrites a destination it may not have made", and
  # that sentence is now false. It is the Lake landing panel's flush editor:
  # how big an object gets and how long it stays open, which changes both the
  # storage bill and every search's cost. Three things bound it. The write is a
  # read-modify-write, so the body sent is the live object with only the edited
  # keys changed and nothing this app has never heard of dropped. The
  # confirmation shows the exact before→after, names EVERY feed writing through
  # the destination — resolved from the sources AND the routing table, never
  # hard-coded — and states that the commit carries every pending change to this
  # group's outputs.yml, including anybody else's. And the deploy that follows
  # restarts this group's Worker Processes, which the same dialog says before it
  # is pressed, not in a toast afterwards.
  #
  # What it does NOT become: a grant to delete or recreate the destination. The
  # reasoning that makes deleting it wrong — the app cannot prove it made it —
  # does not make editing it wrong, but it is why the confirmation says the only
  # way back is this same editor or the group's Git history.
  - object: '/m/:gid/system/outputs'
    actions: ['POST']
  - object: '/m/:gid/system/outputs/gigamon_lake'
    actions: ['GET', 'PATCH']

  # The pipeline that parses Gigamon AMI JSON out of the syslog message and
  # normalizes its fields. POST creates, GET checks, PATCH re-applies the
  # function list to an existing one — and, as with the source above, only when
  # that list actually differs — DELETE is the teardown.
  - object: '/m/:gid/pipelines'
    actions: ['POST']
  - object: '/m/:gid/pipelines/gigamon_syslog'
    actions: ['GET', 'PATCH', 'DELETE']

  # A group has ONE routing table and PATCH replaces it wholesale, so this is the
  # most consequential entry in the file. provision.ts edits the array it just
  # read — one insert, one in-place update, or one removal — rather than
  # composing a new table, so every other route keeps the index the customer gave
  # it. The same PATCH both installs our route and uninstalls it.
  - object: '/m/:gid/routes'
    actions: ['GET']
  - object: '/m/:gid/routes/:tableId'
    actions: ['PATCH']

  # Git versioning on the Leader. /version/status reads which files are pending so
  # the commit can name exactly ours and leave anyone else's pending changes
  # alone; /version/commit commits that list. /version and /version/files are
  # read-only and answer one question: did an earlier run commit something this
  # group never deployed? Without them a commit whose deploy failed can never be
  # deployed by this app again.
  #
  # TWO SURFACES COMMIT, not one: Guided Setup's five objects, and (Phase 3) the
  # Lake landing panel's single outputs.yml. Both always pass an explicit file
  # list, because this API commits every pending change in the repository when
  # given none. Neither can avoid carrying somebody else's pending edit to a file
  # it does name — the unit of a commit is the file — which is why the landing
  # panel's confirmation shows the pending-file list before the press.
  #
  # No revert and no undo. A commit is the customer's own history, and "undo my
  # commit" on a shared repo can just as easily undo somebody else's work.
  - object: '/version'
    actions: ['GET']
  - object: '/version/status'
    actions: ['GET']
  - object: '/version/files'
    actions: ['GET']
  - object: '/version/commit'
    actions: ['POST']

  # NOT DECLARED, DELIBERATELY: the app-scoped KV store (`/kvstore/…`), which
  # cribl/kv.ts reads and writes for the search caps, per-viewer preferences and
  # Guided Setup's commit memory. AGENTS.md: app-scoped paths are granted
  # automatically via the AppUser role when an admin shares the app — "do not
  # redeclare them here". They are listed in src/cribl/paths.ts with
  # `scope: 'app'`, and the coverage test asserts they stay out of this file.
