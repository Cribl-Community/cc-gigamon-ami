# Product API access declaration. Declare Cribl product API paths your app needs to access.
# At install time, admins see exactly which platform resources the app will use.
#
# This app is read-only: it runs Cribl Search jobs against the Cribl Lake dataset
# `gigamon_ami` and reads their results. Search always runs in the default_search
# group, so every call is under /m/default_search/search/...
policies:
  # Submit a search job (POST) and list jobs (GET).
  - object: '/m/default_search/search/jobs'
    actions: ['GET', 'POST']
  # Poll job status, read results, field-summaries and per-job metrics (GET), and
  # cancel (POST /{id}/cancel — the only POST on this sub-path). The app cancels
  # a job it created seconds earlier when the search is abandoned (range change,
  # tab switch, unmount) or passes its 90 s client timeout, so it stops billing
  # instead of running to its cap. That needs no dialog: it is not configuration,
  # and the job belongs to the same user.
  - object: '/m/default_search/search/jobs/*'
    actions: ['GET', 'POST']

  # Cribl Search AI: read whether AI features are enabled, and read/generate
  # "dataset intelligence" for the gigamon_ami Lake dataset. Without this the
  # Copilot agent rediscovers the 319-field schema on every AI investigation.
  - object: '/ai/settings/features'
    actions: ['GET']
  - object: '/ai/settings/dataset-intelligence/*'
    actions: ['GET', 'POST']
