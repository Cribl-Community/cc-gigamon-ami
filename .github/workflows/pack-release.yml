# Publishes the Gigamon AMI onboarding PACK (a Cribl Stream .crbl), never the app.
#
# Triggered ONLY by a tag `gigamon-pack-v<X.Y.Z>`. The pack's source is text
# under packs/cc-network-gigamon-ami/; the .crbl is built here, attached to a
# GitHub release, and never committed. Guided Setup installs it on a Leader
# from that release's download URL.
#
# FIVE RULES, because each one would otherwise publish, hijack or break the
# APP's release (release.yml, which fires on `v*` tags):
#   1. Trigger only on `gigamon-pack-v*`. A pack tag never starts with `v`, so
#      it can never match release.yml's `v*` filter.
#   2. Never run `npm run package`, never write the root package.json, never
#      push a `v*` tag or move `latest`. The last step before publishing fails
#      if package.json or package-lock.json changed.
#   3. Never call the Packs Dispensary. Its endpoint is keyed by the repository
#      name, so an upload from here would replace the app's marketplace entry.
#   4. Create the release with --latest=false. README.md sends users to
#      releases/latest for the APP; a pack release marked Latest would hand
#      them a .crbl instead.
#   5. Never replace a published asset (no --clobber). The app pins the exact
#      URL, so the bytes under it must never change; a fix is a new version.
name: Pack release

on:
  push:
    tags: ['gigamon-pack-v*']

permissions:
  contents: write

concurrency:
  group: pack-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PACK: cc-network-gigamon-ami
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # For the `yaml` parser pack.mjs uses, and for the pack's tests.
      - run: npm ci

      - name: Resolve the pack version from the tag
        id: v
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^gigamon-pack-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::not a pack tag: $GITHUB_REF_NAME (expected gigamon-pack-vX.Y.Z)"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: The samples are exactly what the generator produces
        run: node scripts/gen-pack-samples.mjs --check

      - name: The pack's tests (spec parity, sample coverage, check and build)
        run: npx vitest run src/cribl/pack.test.ts src/cribl/packSamples.test.ts src/cribl/packCheck.test.ts

      - name: Check the pack against the tag's version, and build it
        run: node scripts/pack.mjs build --expect-version "${{ steps.v.outputs.version }}" --out build/packs

      - name: The archive lists cleanly with the system tar
        run: tar -tzvf "build/packs/$PACK-${{ steps.v.outputs.version }}.crbl"

      - name: Guard - nothing app-side changed
        run: git diff --exit-code -- package.json package-lock.json

      - name: Publish (never Latest, never clobber) and read the URL back
        run: |
          set -euo pipefail
          F="build/packs/$PACK-${{ steps.v.outputs.version }}.crbl"
          NAME="$(basename "$F")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists; a published pack is never replaced - bump the pack version"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$F" \
            --verify-tag \
            --latest=false \
            --title "Gigamon AMI onboarding pack ${{ steps.v.outputs.version }}" \
            --notes "The Cribl Stream pack Guided Setup installs. This is not the app; the app is released from v* tags."
          # The asset NAME forms the download URL, not a label: read it back
          # from the API rather than composing it.
          URL="$(gh api "repos/${{ github.repository }}/releases/tags/$GITHUB_REF_NAME" \
            --jq ".assets[] | select(.name == \"$NAME\") | .browser_download_url")"
          if [ -z "$URL" ]; then echo "::error::asset $NAME not found on the release after upload"; exit 1; fi
          curl -fsSL "$URL" -o /tmp/downloaded.crbl
          WANT="$(sha256sum "$F" | cut -d' ' -f1)"
          GOT="$(sha256sum /tmp/downloaded.crbl | cut -d' ' -f1)"
          if [ "$WANT" != "$GOT" ]; then echo "::error::the downloaded asset's bytes differ from the build"; exit 1; fi
          echo "browser_download_url: $URL"
          {
            echo "### Pack ${{ steps.v.outputs.version }} published"
            echo ""
            echo "- PACK_VERSION: \`${{ steps.v.outputs.version }}\`"
            echo "- browser_download_url: $URL"
            echo "- sha256: \`$WANT\`"
            echo ""
            echo "To ship it with the app, set PACK_VERSION in src/cribl/pack.ts in a normal PR."
          } >> "$GITHUB_STEP_SUMMARY"
