# Sources of the cc-network-gigamon-ami pack.
#
# in_gigamon_ami_http: where Gigamon AMX POSTs AMI records (a JSON array per
#   request). Every field but those listed below is provision.ts's Raw HTTP
#   source for a Cribl-managed group, value for value; src/cribl/pack.test.ts
#   fails if the two drift.
#   SHIPS DISABLED. A Cloud port in 20000-20010 is reachable from the internet,
#   so nothing listens until Guided Setup picks a free port, generates a token
#   and enables the input, in one whole-body PATCH of this input.
#   NO AUTH TOKEN. The app generates a random token at install and writes it
#   into this input only; a token shipped here would be one secret shared by
#   every tenant that installed the pack. `npm run pack:check` refuses an
#   http_raw input that carries `authTokens` or `authTokensExt`, or ships
#   enabled.
#   THE PORT IS A PLACEHOLDER inside 20000-20010, the range a Cribl-managed
#   worker group exposes.
#   TLS IS THE CRIBL-MANAGED FORM: Cribl's own certificate. A hybrid group has
#   no such certificate, so Guided Setup turns TLS off there at install and
#   says the traffic is unencrypted until a certificate is added.
#   The breaker it names is this pack's own (default/breakers.yml), not the
#   global one Guided Setup creates.
#
# NO `connections` ON ANY INPUT. Both inputs reach their destinations through
# the routes only (sendToRoutes: true). A QuickConnect `connections` list would
# skip the routes, which is how sample events could reach gigamon_ami.
#
# in_gigamon_ami_sample: synthetic AMI flows for a tenant with no exporter yet.
#   SHIPS DISABLED. Starting it is a confirmed opt-in in Guided Setup.
#   It writes to its own dataset, gigamon_ami_sample, never to gigamon_ami, and
#   every event carries gigamon_origin=sample (the metadata below, and in each
#   sample event as well). The samples are generated by
#   scripts/gen-pack-samples.mjs; never hand-edit them or default/samples.yml.
#   One event per second per sample: 5 events/s in all.
inputs:
  in_gigamon_ami_http:
    type: http_raw
    disabled: true
    host: 0.0.0.0
    port: 20005
    tls:
      disabled: false
      minVersion: TLSv1.2
      certPath: $CRIBL_CLOUD_CRT
      privKeyPath: $CRIBL_CLOUD_KEY
    sendToRoutes: true
    breakerRulesets:
      - gigamon_ami_http_json_array
    autoParse: false
    streamtags:
      - gigamon
      - ami
  in_gigamon_ami_sample:
    type: datagen
    disabled: true
    sendToRoutes: true
    samples:
      - sample: gigamon_ami_services
        eventsPerSec: 1
      - sample: gigamon_ami_web_api
        eventsPerSec: 1
      - sample: gigamon_ami_dns
        eventsPerSec: 1
      - sample: gigamon_ami_tls_apps
        eventsPerSec: 1
      - sample: gigamon_ami_security
        eventsPerSec: 1
    metadata:
      - name: gigamon_origin
        value: "'sample'"
    streamtags:
      - gigamon
      - ami
      - sample
    description: Synthetic Gigamon AMI flows (generated, not real traffic). Writes to gigamon_ami_sample.
