# Sources of the cc-network-gigamon-ami pack.
#
# in_gno_syslog: where a Gigamon AMX exporter sends AMI records.
#   THE PORT IS A PLACEHOLDER. 20005 sits inside 20000-20010, the range a
#   Cribl-managed (Cloud) worker group exposes, so the input never binds a port
#   an exporter cannot reach between install and setup. Guided Setup sets the
#   real port at install (a later slice), with a whole-body PATCH of this input.
#   Every other field is provision.ts's SOURCE_SPEC, value for value;
#   src/cribl/pack.test.ts fails if the two drift.
#
# in_gno_sample: synthetic AMI flows for a tenant with no exporter yet.
#   SHIPS DISABLED. Starting it is a confirmed write in Guided Setup.
#   It writes to its own dataset, gigamon_ami_sample, never to gigamon_ami, and
#   every event carries gno_origin=sample (the metadata below, and in each
#   sample event as well). The samples are generated by
#   scripts/gen-pack-samples.mjs; never hand-edit them or default/samples.yml.
#   One event per second per sample: 5 events/s in all.
inputs:
  in_gno_syslog:
    type: syslog
    disabled: false
    host: 0.0.0.0
    tcpPort: 20005
    udpPort: 20005
    sendToRoutes: true
    streamtags:
      - gigamon
      - ami
  in_gno_sample:
    type: datagen
    disabled: true
    sendToRoutes: true
    samples:
      - sample: gno_services
        eventsPerSec: 1
      - sample: gno_web_api
        eventsPerSec: 1
      - sample: gno_dns
        eventsPerSec: 1
      - sample: gno_tls_apps
        eventsPerSec: 1
      - sample: gno_security
        eventsPerSec: 1
    metadata:
      - name: gno_origin
        value: "'sample'"
    streamtags:
      - gigamon
      - ami
      - sample
    description: Synthetic Gigamon AMI flows (generated, not real traffic). Writes to gigamon_ami_sample.
