# Routes of the cc-network-gigamon-ami pack.
#
# THIS PATH IS THE CONTRACT: a pack's routes live at default/pipelines/route.yml
# (measured: every bundled pack on a Leader lists <pack>/default/pipelines/route.yml,
# and no routes.yml exists anywhere). A default/routes.yml is never read, and
# `npm run pack:check` refuses one.
#
# Three routes and no catch-all: only this pack's two sources feed it.
#   http   -> gigamon_ami_normalize -> gigamon_ami_json_lake    (gigamon_ami, JSON)      NOT final
#   http   -> gigamon_ami_normalize -> gigamon_ami_parquet_lake (gigamon_ami_pq, Parquet) final
#   sample -> gigamon_ami_normalize -> gigamon_ami_sample_lake  (gigamon_ami_sample)     final
#
# THE DUAL WRITE IS THE ORDER. The JSON route is not final, so each HTTP event
# goes down it and on to the Parquet route, which is final. Put the Parquet
# route first and the dashboards' dataset gets nothing.
#
# NO OUTPUT EXPRESSIONS. A route's `output` is the only place its events go:
# `enableOutputExpression: true` with an `outputExpression` would let the sample
# route write into gigamon_ami while still naming the sample destination, and
# Lake has no row delete. `npm run pack:check` refuses either key, refuses a
# DataGen route into any dataset but gigamon_ami_sample, and refuses a
# *_to_parquet route into anything but a Parquet destination (and any other
# route into one). src/cribl/pack.test.ts compares each route here whole.
#
# INSIDE A PACK, __inputId IS `<type>:<packId>.<inputId>` (measured 2026-09-25
# on a Cribl.Cloud Leader: a DataGen `dg_asis` in a test pack
# `cc-network-gigamon-ami-dgtest` stamped
# `datagen:cc-network-gigamon-ami-dgtest.dg_asis` on every event). 0.2.0's
# filters used the global form `<type>:<inputId>`, which never matches inside a
# pack, so with no catch-all it dropped every event of both sources. 0.2.1 names
# its inputs as `<type>:cc-network-gigamon-ami.<inputId>`, and `npm run
# pack:check` refuses the global form.
id: default
groups: {}
comments: []
routes:
  - id: gigamon_ami_http_to_json
    name: gigamon_ami_http_to_json
    final: false
    disabled: false
    filter: __inputId=='http_raw:cc-network-gigamon-ami.in_gigamon_ami_http'
    pipeline: gigamon_ami_normalize
    output: gigamon_ami_json_lake
    description: Gigamon AMI over HTTP → normalize → Cribl Lake (gigamon_ami)
    clones: []
    enableOutputExpression: false
  - id: gigamon_ami_http_to_parquet
    name: gigamon_ami_http_to_parquet
    final: true
    disabled: false
    filter: __inputId=='http_raw:cc-network-gigamon-ami.in_gigamon_ami_http'
    pipeline: gigamon_ami_normalize
    output: gigamon_ami_parquet_lake
    description: Gigamon AMI over HTTP → normalize → Cribl Lake (gigamon_ami_pq, Parquet)
    clones: []
    enableOutputExpression: false
  - id: gigamon_ami_sample
    name: gigamon_ami_sample
    final: true
    disabled: false
    filter: __inputId=='datagen:cc-network-gigamon-ami.in_gigamon_ami_sample'
    pipeline: gigamon_ami_normalize
    output: gigamon_ami_sample_lake
    description: Gigamon AMI sample data → Cribl Lake (gigamon_ami_sample)
    clones: []
    enableOutputExpression: false
